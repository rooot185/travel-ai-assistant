name: Verify
on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: travel_test
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travel -d travel_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TRAVEL_TEST_DB: jdbc:postgresql://127.0.0.1:5432/travel_test
      TRAVEL_TEST_DB_USER: travel
      TRAVEL_TEST_DB_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f backend/pom.xml verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    env:
      DATABASE_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - run: |
          curl --fail --retry 4 http://127.0.0.1:8088/
          curl --fail http://127.0.0.1:8088/api/status
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
